<!DOCTYPE html>
<!--
  Ch 1. Antigravity IDE 첫 실습 산출물 — 나만의 HTML 프로필 페이지 (책 완성본)
  책의 프롬프트("이름은 OOO, 직업은 초등학교 교사, 좋아하는 것은 독서와 여행,
  배경색은 연한 파란색...")로 만든 결과물입니다.
  "닷커넥터" 부분을 본인 이름으로 바꿔서 사용해 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>닷커넥터의 프로필</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: #dbeeff; /* 연한 파란색 배경 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .profile-card {
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(70, 130, 190, 0.18);
      max-width: 430px;
      width: 100%;
      padding: 44px 34px 40px;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid #bfe0f8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      margin: 0 auto 26px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      color: #1f2d3d;
      margin-bottom: 10px;
    }

    .job {
      font-size: 16px;
      font-weight: 700;
      color: #2f7fd3;
      margin-bottom: 24px;
    }

    .intro {
      font-size: 15.5px;
      line-height: 1.75;
      color: #4a5866;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    .divider {
      border: none;
      border-top: 1px solid #e3eaf1;
      margin-bottom: 24px;
    }

    .likes-title {
      font-size: 14px;
      color: #8696a6;
      margin-bottom: 16px;
    }

    .likes {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .like-item {
      background: #eef5fb;
      border-radius: 999px;
      padding: 10px 22px;
      font-size: 15px;
      font-weight: 700;
      color: #33475b;
    }

    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #bfe0f8;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #2f7fd3;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(70, 130, 190, 0.15);
    }
  </style>
</head>
<body>
  <a class="back-link" href="../">← 산출물 갤러리</a>
  <main class="profile-card">
    <div class="avatar">👩‍🏫</div>
    <h1>닷커넥터</h1>
    <p class="job">초등학교 교사 🎒</p>
    <p class="intro">
      안녕하세요! 만나서 반갑습니다 👋<br />
      아이들과 함께 성장하며 즐겁게 배우는 초등학교
      교사입니다. 따뜻하고 긍정적인 에너지를 나누는
      것을 좋아해요.
    </p>
    <hr class="divider" />
    <p class="likes-title">제가 좋아하는 것들은</p>
    <div class="likes">
      <span class="like-item">📚 독서</span>
      <span class="like-item">✈️ 여행</span>
    </div>
  </main>
</body>
</html>

<!DOCTYPE html>
<!--
  우리 반 실시간 칭찬 보드 — 체험판 데모 (Demo Mode)
  Supabase 없이 브라우저 메모리에서 동작하는 맛보기 버전입니다.
  · 데이터는 저장되지 않으며 새로고침하면 초기화됩니다.
  · 같은 브라우저에서 창(탭)을 2개 열면 BroadcastChannel로
    실시간 동기화를 흉내 내어 책 속 "실시간 반영"을 체험할 수 있습니다.
  실제 완성본(React + Vite + Supabase Realtime) 소스코드는 저장소의
  Part4-로컬개발/Ch04-MCP-실시간-협업보드/완성본/ 폴더에 있습니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 실시간 칭찬 보드 — 체험판</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: linear-gradient(160deg, #fffbeb 0%, #fef9f3 50%, #f0f9ff 100%);
      min-height: 100vh;
      color: #374151;
    }

    .app { max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ── 체험판 안내 배너 ─────────────── */
    .demo-banner {
      background: #eff6ff;
      border: 1.5px dashed #93c5fd;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 13.5px;
      line-height: 1.7;
      color: #1e40af;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    .demo-banner strong { color: #1d4ed8; }
    .demo-banner a { color: #1d4ed8; font-weight: 700; }

    /* ── 헤더 ─────────────────────────── */
    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 30px; color: #b45309; margin-bottom: 8px; }
    .header p { color: #92400e; font-size: 15px; }

    /* ── 입력 폼 ───────────────────────── */
    .praise-form {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(180, 83, 9, 0.1);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 36px;
    }

    .praise-form input,
    .praise-form textarea {
      border: 2px solid #fde68a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      transition: border-color 0.2s;
    }

    .praise-form input:focus,
    .praise-form textarea:focus { outline: none; border-color: #f59e0b; }

    .praise-form button {
      align-self: flex-end;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.35);
    }

    .praise-form button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.4);
    }

    .praise-form button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── 칭찬 카드 보드 ─────────────────── */
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #9ca3af;
      padding: 50px 0;
      font-size: 16px;
    }

    .card {
      border-radius: 16px;
      padding: 20px 18px 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: pop-in 0.35s ease;
      word-break: keep-all;
    }

    .color-0 { background: #fef9c3; }
    .color-1 { background: #dcfce7; }
    .color-2 { background: #e0f2fe; }
    .color-3 { background: #fce7f3; }

    .card-name { font-weight: 800; font-size: 16px; color: #1f2937; }
    .card-message { font-size: 14.5px; line-height: 1.6; color: #374151; flex: 1; }
    .card-time { font-size: 12px; color: #9ca3af; text-align: right; }

    @keyframes pop-in {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .back-link {
      display: inline-block;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 700;
      color: #1d4ed8;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 24px; }
      .praise-form button { align-self: stretch; }
    }
  </style>
</head>
<body>
  <div class="app">
    <a class="back-link" href="../">← 산출물 갤러리</a>

    <div class="demo-banner">
      🧪 <strong>체험판 데모</strong>입니다. Supabase 없이 브라우저 메모리에서만 동작하며,
      새로고침하면 내용이 초기화됩니다. 이 페이지를 <strong>창 2개로 나란히 열고</strong>
      한쪽에서 칭찬을 남겨 보세요 — 책에서 배우는 "실시간 반영"을 미리 체험할 수 있어요!
      실제 완성본(React + Vite + Supabase Realtime) 소스코드는
      <a href="https://github.com/lifeofpi-ux/vibecode-for-teacher/tree/main/Part4-%EB%A1%9C%EC%BB%AC%EA%B0%9C%EB%B0%9C/Ch04-MCP-%EC%8B%A4%EC%8B%9C%EA%B0%84-%ED%98%91%EC%97%85%EB%B3%B4%EB%93%9C/%EC%99%84%EC%84%B1%EB%B3%B8" target="_blank" rel="noopener">저장소</a>에 있습니다.
    </div>

    <header class="header">
      <h1>🌟 우리 반 실시간 칭찬 보드</h1>
      <p>친구의 좋은 점을 발견하면 바로 칭찬해 주세요!</p>
    </header>

    <form class="praise-form" id="praiseForm">
      <input type="text" id="studentName" placeholder="학생 이름" maxlength="20" />
      <textarea id="message" rows="2" maxlength="200"
        placeholder="칭찬 메시지를 적어주세요 (예: 수학 문제를 끝까지 포기하지 않았어요!)"></textarea>
      <button type="submit" id="submitBtn" disabled>💌 칭찬 남기기</button>
    </form>

    <main class="board" id="board"></main>
  </div>

  <script>
    // ── 체험판 데이터: 브라우저 메모리에만 존재 (새로고침 시 초기화) ──
    const seedTime = Date.now();
    let praises = [
      { id: 's1', student_name: '강혜심', message: '수학 문제를 끝까지 포기하지 않았어요!', created_at: new Date(seedTime - 1000 * 60 * 14).toISOString() },
      { id: 's2', student_name: '이도윤', message: '넘어진 친구를 제일 먼저 달려가 도와줬어요. 마음이 참 따뜻해요.', created_at: new Date(seedTime - 1000 * 60 * 9).toISOString() },
      { id: 's3', student_name: '박서연', message: '급식실에서 조용히 줄 서는 모습이 멋졌어요!', created_at: new Date(seedTime - 1000 * 60 * 3).toISOString() },
    ];

    // ── 실시간 흉내: 같은 브라우저의 다른 창(탭)과 동기화 ──
    // 실제 앱에서는 이 역할을 Supabase Realtime이 담당합니다.
    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('praise-board-demo') : null;
    if (channel) {
      channel.onmessage = (event) => {
        const praise = event.data;
        if (!praises.some((p) => p.id === praise.id)) {
          praises = [praise, ...praises];
          render();
        }
      };
    }

    const board = document.getElementById('board');
    const form = document.getElementById('praiseForm');
    const nameInput = document.getElementById('studentName');
    const msgInput = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    function formatTime(iso) {
      const d = new Date(iso);
      return `${d.getMonth() + 1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function render() {
      if (praises.length === 0) {
        board.innerHTML = '<p class="empty">아직 칭찬이 없어요. 첫 번째 칭찬을 남겨보세요! ✨</p>';
        return;
      }
      board.innerHTML = '';
      praises.forEach((praise, index) => {
        const card = document.createElement('article');
        card.className = `card color-${index % 4}`;

        const name = document.createElement('div');
        name.className = 'card-name';
        name.textContent = `🏅 ${praise.student_name}`;

        const msg = document.createElement('p');
        msg.className = 'card-message';
        msg.textContent = praise.message;

        const time = document.createElement('time');
        time.className = 'card-time';
        time.textContent = formatTime(praise.created_at);

        card.append(name, msg, time);
        board.appendChild(card);
      });
    }

    function updateButton() {
      submitBtn.disabled = !nameInput.value.trim() || !msgInput.value.trim();
    }
    nameInput.addEventListener('input', updateButton);
    msgInput.addEventListener('input', updateButton);

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const praise = {
        id: 'p' + Date.now() + Math.random().toString(36).slice(2, 7),
        student_name: nameInput.value.trim(),
        message: msgInput.value.trim(),
        created_at: new Date().toISOString(),
      };
      praises = [praise, ...praises];
      render();
      if (channel) channel.postMessage(praise); // 다른 창에도 실시간 전달
      nameInput.value = '';
      msgInput.value = '';
      updateButton();
      nameInput.focus();
    });

    render();
  </script>
</body>
</html>

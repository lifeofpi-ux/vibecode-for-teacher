<!DOCTYPE html>
<!--
  Ch 1. Antigravity 첫 실습 산출물 예시 — 나만의 HTML 프로필 페이지
  책의 프롬프트("이름은 OOO, 직업은 초등학교 교사, 독서와 여행...")로
  AI가 만들어 주는 결과물의 완성 예시입니다.
  "김하늘" 부분을 본인 이름으로 바꿔서 사용해 보세요.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>김하늘 선생님의 프로필</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: linear-gradient(160deg, #dbeafe 0%, #e0f2fe 55%, #eff6ff 100%); /* 연한 파란색 배경 */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .profile-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(30, 64, 175, 0.16);
      max-width: 420px;
      width: 100%;
      padding: 48px 36px 40px;
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #93c5fd, #60a5fa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      margin: 0 auto 20px;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
    }

    h1 {
      font-size: 28px;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .job {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      margin-bottom: 22px;
    }

    .intro {
      font-size: 15.5px;
      line-height: 1.7;
      color: #475569;
      margin-bottom: 28px;
      word-break: keep-all;
    }

    .likes {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .like-item {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 16px;
      padding: 14px 20px;
      min-width: 110px;
    }

    .like-item .emoji { font-size: 28px; display: block; margin-bottom: 6px; }
    .like-item .label { font-size: 14px; font-weight: 700; color: #0369a1; }

    footer {
      margin-top: 30px;
      font-size: 12.5px;
      color: #94a3b8;
    }

    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      color: #1d4ed8;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(30, 64, 175, 0.12);
    }
  </style>
</head>
<body>
  <a class="back-link" href="../">← 산출물 갤러리</a>
  <main class="profile-card">
    <div class="avatar">🧑‍🏫</div>
    <h1>김하늘</h1>
    <span class="job">초등학교 교사</span>
    <p class="intro">
      안녕하세요! 아이들과 함께 배우고 성장하는 것을 좋아하는
      초등학교 교사 김하늘입니다. 새로운 것을 배우는 즐거움을
      교실에서 아이들과 나누는 것이 저의 가장 큰 행복입니다.
    </p>
    <div class="likes">
      <div class="like-item">
        <span class="emoji">📚</span>
        <span class="label">독서</span>
      </div>
      <div class="like-item">
        <span class="emoji">✈️</span>
        <span class="label">여행</span>
      </div>
    </div>
    <footer>Antigravity IDE와 함께 만든 나의 첫 웹페이지</footer>
  </main>
</body>
</html>
